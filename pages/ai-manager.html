<script>
/* ── AI Manager ────────────────────────────────────────────────────────────
   Two tabs over the same idea: the prompts Ray can be asked to run, and the
   ordered sets of prompts he runs on his own. Both read and write through the
   permission layer rather than the fixtures, so a read-only role sees the same
   screen with the controls it is actually allowed to use.                    */
let aiGuard, aiTab = 'prompts', aiEditing = null;

const aiEsc = (s) => String(s == null ? '' : s)
  .replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* dd/mm/yyyy, the way the live table writes it. */
function aiDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function aiToday() { return new Date().toISOString().slice(0, 10); }

function aiCan(scope) { return aiGuard.scopes.indexOf(scope) >= 0; }

function aiRepo(name) { return RayPermissions.Repositories[name]; }

/* One place to report a refusal from the permission layer, so a blocked write
   reads as a rule rather than as nothing happening. */
function aiTry(fn) {
  try { return fn(); }
  catch (err) { RayPanel.toast(err && (err.reason || err.message) || 'Not permitted'); return null; }
}

/* ── Saved Prompts ─────────────────────────────────────────────────────── */
function aiPrompts() {
  const rows = aiTry(() => aiRepo('promptLibrary').list(aiGuard)) || [];
  const canWrite = aiCan('prompt_library.write');
  return `
    <div class="ai-head">
      <div>
        <h2>Saved Prompts</h2>
        <p class="sub">The prompts anyone in your business can pick from Ray's composer.
           Switch one off to retire it without losing the wording.</p>
      </div>
      ${canWrite ? `<button class="btn pri" data-ai-add-prompt>Add Prompt</button>` : ''}
    </div>
    <table class="ai-tbl">
      <thead><tr>
        <th class="n">#</th><th class="st">Status</th><th>Title</th>
        <th>Prompt</th><th class="dt">Created date</th><th class="ac"></th>
      </tr></thead>
      <tbody>${rows.length ? rows.map((r, i) => `
        <tr class="${r.active === false ? 'off' : ''}">
          <td class="n">${i + 1}</td>
          <td class="st"><span class="ai-status ${r.active === false ? 'no' : 'yes'}">
            ${r.active === false ? 'Inactive' : 'Active'}</span></td>
          <td class="ti"><span class="x">${aiEsc(r.label)}</span>
            ${r.isDefault ? '<span class="ai-badge">Default</span>' : ''}</td>
          <td class="pr"><span class="x">${aiEsc(r.text)}</span></td>
          <td class="dt">${aiDate(r.created)}</td>
          <td class="ac">${canWrite ? `
            <button class="ai-ic" data-ai-edit-prompt="${r.id}" title="Edit prompt">
              <span class="ms">edit</span></button>
            <button class="ai-ic del" data-ai-del-prompt="${r.id}" title="Delete prompt">
              <span class="ms">delete</span></button>` : ''}</td>
        </tr>`).join('')
      : `<tr><td colspan="6" class="ai-none">No saved prompts yet.</td></tr>`}
      </tbody>
    </table>`;
}

/* The dialog from the third mock: a title, the prompt itself, and an Active
   switch in the head. It serves the library only — a workflow step is edited
   where it lives, inside the workflow, rather than by swapping this same modal
   out from under you. */
function aiPromptDialog(o) {
  const isNew = !o.id;
  rayDlg(isNew ? 'Add Prompt' : 'Edit Prompt', `
    <label class="ai-f">Prompt Title
      <input id="aiPT" placeholder="Enter Prompt Title" value="${aiEsc(o.label)}"></label>
    <label class="ai-f">Prompt
      <textarea id="aiPX" rows="9" placeholder="Enter Prompt …">${aiEsc(o.text)}</textarea></label>
    ${o.isDefault ? `<p class="ai-lock"><span class="ms">info</span>
      This one ships with Tenderfy. Edit it freely — the Default label only
      records where it came from.</p>` : ''}`,
    `<button class="btn" data-dlg-close>Cancel</button>
     <button class="btn pri" id="aiPSave">${isNew ? 'Add Prompt' : 'Save changes'}</button>`);

  aiHeadSwitch(o.active);
  const title = document.getElementById('aiPT');
  const text = document.getElementById('aiPX');
  const save = document.getElementById('aiPSave');
  const sync = () => { save.disabled = !(title.value.trim() && text.value.trim()); };
  title.oninput = text.oninput = sync; sync();
  save.onclick = () => {
    const v = { label: title.value.trim(), text: text.value.trim(), active: aiSwitchOn() };
    rayDlgClose();
    o.onSave(v);
  };
  title.focus();
}

/* Both dialogs carry the same Active switch in the same place, which is most
   of what stops them reading as two unrelated screens. */
function aiHeadSwitch(active) {
  const head = document.querySelector('#rayDlg .dlg-head');
  const sw = document.createElement('button');
  sw.className = 'ai-sw' + (active === false ? '' : ' on');
  sw.type = 'button';
  sw.innerHTML = `<span class="k"></span><span class="l">${active === false ? 'Inactive' : 'Active'}</span>`;
  sw.onclick = () => {
    sw.classList.toggle('on');
    sw.querySelector('.l').textContent = sw.classList.contains('on') ? 'Active' : 'Inactive';
  };
  head.insertBefore(sw, head.querySelector('.dlg-x'));
  return sw;
}
function aiSwitchOn() {
  const sw = document.querySelector('#rayDlg .ai-sw');
  return !sw || sw.classList.contains('on');
}

function aiAddPrompt() {
  aiPromptDialog({
    onSave: (v) => {
      aiTry(() => aiRepo('promptLibrary').add(aiGuard, Object.assign({ created: aiToday() }, v)));
      aiPaint();
      RayPanel.toast('Prompt added');
    },
  });
}

function aiEditPrompt(id) {
  const r = (aiTry(() => aiRepo('promptLibrary').list(aiGuard)) || []).find((x) => x.id === id);
  if (!r) return;
  aiPromptDialog({
    id: r.id, label: r.label, text: r.text,
    active: r.active, isDefault: !!r.isDefault,
    onSave: (v) => {
      aiTry(() => aiRepo('promptLibrary').update(aiGuard, id, v));
      aiPaint();
    },
  });
}

function aiDelPrompt(id) {
  const r = (aiTry(() => aiRepo('promptLibrary').list(aiGuard)) || []).find((x) => x.id === id);
  if (!r) return;
  rayDlg('Delete prompt', `
    <p>Delete <b>${aiEsc(r.label)}</b>? It will stop appearing in Ray's composer
       for everyone in your business.</p>
    ${r.isDefault ? `<p class="ai-lock"><span class="ms">info</span>
       This one ships with Tenderfy. Switching it to Inactive keeps it available
       to turn back on later.</p>` : ''}`,
    `<button class="btn" data-dlg-close>Cancel</button>
     <button class="btn danger" id="aiDelGo">Delete</button>`);
  document.getElementById('aiDelGo').onclick = () => {
    aiTry(() => aiRepo('promptLibrary').remove(aiGuard, id));
    rayDlgClose(); aiPaint(); RayPanel.toast('Prompt deleted');
  };
}

/* ── Workflow Manager ──────────────────────────────────────────────────── */
function aiWorkflows() {
  const rows = aiTry(() => aiRepo('workflows').list(aiGuard)) || [];
  const canWrite = aiCan('workflow.write');
  return `
    <div class="ai-head">
      <div>
        <h2>Workflow Manager</h2>
        <p class="sub">An ordered set of prompts Ray runs one at a time, pausing for
           your approval between each. The Tenderfy Method is the one we ship —
           edit it to match how your team actually bids.</p>
      </div>
      ${canWrite ? `<button class="btn pri" data-ai-add-wf>Create Workflow</button>` : ''}
    </div>
    <div class="ai-wfs">${rows.map((w) => `
      <div class="ai-wf${w.active === false ? ' off' : ''}">
        <div class="ai-wfic"><span class="ms">play_lesson</span></div>
        <div class="ai-wftx">
          <div class="h">${aiEsc(w.name)}
            ${w.isDefault ? '<span class="ai-badge">Default</span>' : ''}
            ${w.active === false ? '<span class="ai-badge off">Inactive</span>' : ''}</div>
          <div class="d">${aiEsc(w.description)}</div>
          <div class="m">${w.steps.length} step${w.steps.length === 1 ? '' : 's'}
            · Created ${aiDate(w.created)}</div>
        </div>
        <div class="ai-wfacts">
          <button class="btn" data-ai-view-wf="${w.id}">View</button>
          ${canWrite ? `
            <button class="ai-ic" data-ai-edit-wf="${w.id}" title="Edit workflow">
              <span class="ms">edit</span></button>
            <button class="ai-ic" data-ai-dup-wf="${w.id}" title="Duplicate workflow">
              <span class="ms">content_copy</span></button>
            <button class="ai-ic del" data-ai-del-wf="${w.id}" title="Delete workflow">
              <span class="ms">delete</span></button>` : ''}
        </div>
      </div>`).join('')}</div>`;
}

/* Viewing reuses the panel's "Working through a tender" shape: the numbered
   list, read top to bottom. Here it carries each step's prompt rather than a
   progress state, because nothing is running — this is the recipe, not a bid. */
function aiViewWorkflow(id) {
  const w = aiTry(() => aiRepo('workflows').get(aiGuard, id));
  if (!w) return;
  const canWrite = aiCan('workflow.write');
  rayDlg(w.name, `
    <p>${aiEsc(w.description)}</p>
    <div class="dlg-steps">${w.steps.map((st, i) => `
      <div class="dlg-step">
        <span class="ms">radio_button_unchecked</span>
        <div class="t"><span class="h">${i + 1}. ${aiEsc(st.title)}</span>
          <span class="d">${aiEsc(st.prompt)}</span></div>
      </div>`).join('')}</div>`,
    canWrite
      ? `<button class="btn" data-dlg-close>Close</button>
         <button class="btn pri" id="aiViewEdit">Edit workflow</button>`
      : `<button class="btn dlg-wide" data-dlg-close>Close</button>`);
  const go = document.getElementById('aiViewEdit');
  /* Straight from reading it to changing it, without going back to the list
     to find the row again. */
  if (go) go.onclick = () => aiEditWorkflow(id);
}

/* Editing works on a copy and commits on save, so abandoning the dialog leaves
   the stored workflow untouched. `dup` starts a new one from an existing one —
   the Tenderfy Method included, though it is editable in place as well. */
function aiEditWorkflow(id, dup) {
  const src = id ? aiTry(() => aiRepo('workflows').get(aiGuard, id)) : null;
  if (id && !src) return;
  aiEditing = src
    ? { id: dup ? null : src.id,
        name: dup ? src.name + ' (copy)' : src.name,
        description: src.description,
        active: src.active !== false,
        steps: src.steps.map((x) => Object.assign({}, x)),
        edit: null, draft: null }
    : { id: null, name: '', description: '', active: true,
        steps: [], edit: null, draft: null };
  aiPaintWfDialog();
}

/* One dialog for the whole job. Adding or editing a step opens a card in the
   list rather than swapping this modal for another one — the step is part of
   the workflow, so it is edited without leaving it. Repaints happen only on
   structural changes (add, remove, reorder, open, close), never on a
   keystroke, so nothing steals focus while you type. */
function aiPaintWfDialog() {
  const w = aiEditing;
  const editing = w.edit !== null;

  const stepCard = (st, i) => `
    <div class="ai-step">
      <span class="nm">${i + 1}</span>
      <div class="t"><span class="h">${aiEsc(st.title)}</span>
        <span class="d">${aiEsc(st.prompt)}</span></div>
      <div class="a">
        <button class="ai-ic" data-ai-step-up="${i}" ${i ? '' : 'disabled'}
                title="Move up"><span class="ms">arrow_upward</span></button>
        <button class="ai-ic" data-ai-step-dn="${i}"
                ${i === w.steps.length - 1 ? 'disabled' : ''}
                title="Move down"><span class="ms">arrow_downward</span></button>
        <button class="ai-ic" data-ai-step-ed="${i}" title="Edit step">
          <span class="ms">edit</span></button>
        <button class="ai-ic del" data-ai-step-rm="${i}" title="Remove step">
          <span class="ms">delete</span></button>
      </div>
    </div>`;

  const editCard = (n) => `
    <div class="ai-step open">
      <span class="nm">${n}</span>
      <div class="t">
        <label class="ai-f sm">Step title
          <input id="aiST" placeholder="What this step is called"
                 value="${aiEsc(w.draft.title)}"></label>
        <label class="ai-f sm">Prompt
          <textarea id="aiSX" rows="5"
                    placeholder="What Ray should do at this step">${aiEsc(w.draft.prompt)}</textarea></label>
        <div class="ai-stepacts">
          <button class="btn sm" data-ai-step-cancel>Cancel</button>
          <button class="btn sm pri" data-ai-step-ok>${w.edit === 'new' ? 'Add step' : 'Done'}</button>
        </div>
      </div>
    </div>`;

  const list = w.steps.map((st, i) =>
    w.edit === i ? editCard(i + 1) : stepCard(st, i)).join('')
    + (w.edit === 'new' ? editCard(w.steps.length + 1) : '');

  rayDlg(w.id ? 'Edit workflow' : 'Create workflow', `
    <label class="ai-f">Workflow name
      <input id="aiWN" placeholder="Enter workflow name" value="${aiEsc(w.name)}"></label>
    <label class="ai-f">Workflow description
      <textarea id="aiWD" rows="3"
                placeholder="What this workflow is for, and when to use it">${aiEsc(w.description)}</textarea></label>
    <div class="ai-steplab">Steps<span>${w.steps.length}</span></div>
    <div class="ai-steps">${list || `<p class="ai-none">No steps yet. Add the first prompt Ray should run.</p>`}</div>
    ${editing ? '' : `<button class="ai-addstep" data-ai-step-add>
      <span class="ms">add</span>Add a step</button>`}`,
    `<button class="btn" data-dlg-close>Cancel</button>
     <button class="btn pri" id="aiWSave">${w.id ? 'Save changes' : 'Create workflow'}</button>`);

  aiHeadSwitch(w.active);

  const nm = document.getElementById('aiWN');
  const ds = document.getElementById('aiWD');
  const save = document.getElementById('aiWSave');
  /* Read the fields back before any repaint, so a half-typed name survives
     adding a step. */
  const hold = () => { w.name = nm.value; w.description = ds.value; };
  const holdDraft = () => {
    const t = document.getElementById('aiST'), x = document.getElementById('aiSX');
    if (t && x) w.draft = { title: t.value, prompt: x.value };
  };
  const sync = () => { save.disabled = !(nm.value.trim() && w.steps.length); };
  nm.oninput = ds.oninput = () => { hold(); sync(); };
  sync();

  const st = document.getElementById('aiST');
  if (st) { st.focus(); st.setSelectionRange(st.value.length, st.value.length); }

  const body = document.querySelector('#rayDlg .dlg-body');
  const commit = () => {
    holdDraft();
    const d = w.draft;
    if (!d || !d.title.trim() || !d.prompt.trim()) return false;
    const rec = { title: d.title.trim(), prompt: d.prompt.trim() };
    if (w.edit === 'new') w.steps.push(rec);
    else w.steps[w.edit] = Object.assign({}, w.steps[w.edit], rec);
    w.edit = null; w.draft = null;
    return true;
  };

  body.onclick = (e) => {
    const num = (a) => { const el = e.target.closest(`[${a}]`);
                         return el ? +el.getAttribute(a) : null; };
    const swap = (a, b) => { const t = w.steps[a]; w.steps[a] = w.steps[b]; w.steps[b] = t; };
    let i;
    if (e.target.closest('[data-ai-step-ok]')) { hold(); commit(); aiPaintWfDialog(); return; }
    if (e.target.closest('[data-ai-step-cancel]')) {
      hold(); w.edit = null; w.draft = null; aiPaintWfDialog(); return;
    }
    if (e.target.closest('[data-ai-step-add]')) {
      hold(); w.edit = 'new'; w.draft = { title: '', prompt: '' };
      aiPaintWfDialog(); return;
    }
    if ((i = num('data-ai-step-ed')) !== null) {
      hold(); w.edit = i; w.draft = Object.assign({}, w.steps[i]);
      aiPaintWfDialog(); return;
    }
    if ((i = num('data-ai-step-up')) !== null) { hold(); holdDraft(); swap(i, i - 1); aiPaintWfDialog(); return; }
    if ((i = num('data-ai-step-dn')) !== null) { hold(); holdDraft(); swap(i, i + 1); aiPaintWfDialog(); return; }
    if ((i = num('data-ai-step-rm')) !== null) {
      hold(); holdDraft();
      w.steps.splice(i, 1);
      /* The open editor tracks an index, so removing a row above it would
         otherwise leave it pointing at the wrong step. */
      if (w.edit === i) { w.edit = null; w.draft = null; }
      else if (typeof w.edit === 'number' && w.edit > i) w.edit--;
      aiPaintWfDialog(); return;
    }
  };

  save.onclick = () => {
    hold();
    /* A step still open and filled in is what you meant to keep; an empty one
       is not. Either way Save is never a dead end. */
    if (w.edit !== null) commit();
    const patch = { name: w.name.trim(), description: w.description.trim(),
                    active: aiSwitchOn(), steps: w.steps };
    const ok = w.id
      ? aiTry(() => aiRepo('workflows').update(aiGuard, w.id, patch))
      : aiTry(() => aiRepo('workflows').add(aiGuard, Object.assign({ created: aiToday() }, patch)));
    if (!ok) return;
    rayDlgClose(); aiEditing = null; aiPaint();
    RayPanel.toast(w.id ? 'Workflow saved' : 'Workflow created');
  };
}

function aiDelWorkflow(id) {
  const w = aiTry(() => aiRepo('workflows').get(aiGuard, id));
  if (!w) return;
  rayDlg('Delete workflow', `
    <p>Delete <b>${aiEsc(w.name)}</b> and its ${w.steps.length} steps?
       Anyone part-way through it keeps what Ray has already produced.</p>`,
    `<button class="btn" data-dlg-close>Cancel</button>
     <button class="btn danger" id="aiDelGo">Delete</button>`);
  document.getElementById('aiDelGo').onclick = () => {
    aiTry(() => aiRepo('workflows').remove(aiGuard, id));
    rayDlgClose(); aiPaint(); RayPanel.toast('Workflow deleted');
  };
}

/* ── Wiring ────────────────────────────────────────────────────────────── */
function aiPaint() {
  document.getElementById('aiPane').innerHTML =
    aiTab === 'prompts' ? aiPrompts() : aiWorkflows();
}

window.onPageReady = function (service) {
  aiGuard = service.guard;
  aiPaint();

  document.querySelector('.ai-tabs').onclick = (e) => {
    const t = e.target.closest('[data-ai-tab]');
    if (!t) return;
    document.querySelectorAll('.ai-tab').forEach((x) => x.classList.remove('on'));
    t.classList.add('on');
    aiTab = t.getAttribute('data-ai-tab');
    aiPaint();
  };

  document.getElementById('aiPane').onclick = (e) => {
    const at = (a) => { const el = e.target.closest(`[${a}]`);
                        return el ? el.getAttribute(a) : null; };
    let v;
    if (e.target.closest('[data-ai-add-prompt]')) return aiAddPrompt();
    if ((v = at('data-ai-edit-prompt'))) return aiEditPrompt(v);
    if ((v = at('data-ai-del-prompt'))) return aiDelPrompt(v);
    if (e.target.closest('[data-ai-add-wf]')) return aiEditWorkflow(null);
    if ((v = at('data-ai-view-wf'))) return aiViewWorkflow(v);
    if ((v = at('data-ai-edit-wf'))) return aiEditWorkflow(v);
    if ((v = at('data-ai-dup-wf'))) return aiEditWorkflow(v, true);
    if ((v = at('data-ai-del-wf'))) return aiDelWorkflow(v);
  };
};
</script>
<script src="../app.js?v=a73da6ac"></script>
</body>
</html>
