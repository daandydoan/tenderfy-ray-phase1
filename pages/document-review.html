<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Document review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="screen" style="display:none">

<div class="pad">
  <div class="sect-h">
    <div><h1>Document review</h1><p class="sub" style="margin:0">Environmental Industries · 5 documents</p></div>
    <a class="btn ray" onclick="RayPanel.open();RayPanel.current.run('Review all documents for this tender')">
      <img src="../assets/ray.svg" alt=""> Review all with Ray</a>
  </div>

  <div class="card">
    <div id="docs"></div>
  </div>

  <div class="card">
    <h2><span class="ms sec-ic c-amber">bolt</span> Ask across the set</h2>
    <div class="crumbsel" id="quick"></div>
  </div>

  <div class="card devonly">
    <h2><span class="ms sec-ic c-plum">rule</span> The reading plan</h2>
    <table class="data" id="planTbl"></table>
    <div class="sub" id="planFoot" style="margin-top:12px"></div>
  </div>
</div>

</div>

<script src="../data/fixtures.js"></script>
<script src="../ray/ray-permissions.js"></script>
<script src="../ray/ray-documents.js"></script>
<script src="../ray/ray-context.js"></script>
<script src="../ray/ray-tools.js"></script>
<script src="../ray/ray-provider.js"></script>
<script src="../ray/ray-surfaces.js"></script>
<script src="../ray/ray-core.js"></script>
<script src="../ray/ray-panel.js"></script>
<script>window.PAGE = {"nav": "review", "crumb": "Tenders \u2022 Document review", "ray": {"surface": "document-review", "context": {"tenderId": "t-envind"}}};</script>
<script>
window.onPageReady = function(service, user){
  const g=service.guard, R=RayPermissions.Repositories;
  const ICON={pdf:'picture_as_pdf',docx:'description',xlsx:'table_chart'};
  const docs=R.documents.list(g,'t-envind');
  document.getElementById('docs').innerHTML = docs.map(d=>`
    <div class="doc">
      <span class="ic k-${d.kind}"><span class="ms">${ICON[d.kind]||'draft'}</span></span>
      <div><div class="nm">${d.name}</div><div class="mt">${d.pages} pages${d.scanned?' · scanned':''} · added ${rayDate(d.uploaded)}</div></div>
      <div class="rt"><a class="btn" onclick="RayPanel.open();RayPanel.current.run('What is in ${d.name}?')">Ask Ray</a></div>
    </div>`).join('');

  const ask=(q)=>`<a onclick="RayPanel.open();RayPanel.current.run(this.textContent)">${q}</a>`;
  document.getElementById('quick').innerHTML =
    ['Which requirements conflict between documents?','What does the scanned survey add?',
     'What are the risks in the draft contract?'].map(ask).join('');

  const set=service.reader.planSet(docs,'broad',6000);
  document.getElementById('planTbl').innerHTML =
    '<thead><tr><th>Document</th><th>Pages</th><th>Strategy</th><th>Est. tokens</th></tr></thead><tbody>'
    + set.plans.map(p=>`<tr${p.deferred?' class="locked"':''}><td><b>${p.docName}</b><div class="sub" style="margin:2px 0 0;font-size:11.5px">${p.reason}</div></td>
        <td>${p.pages}</td><td><span class="ray-strat s-${p.strategy}">${p.label}</span></td>
        <td>${p.estTokens}${p.deferred?'<div class="sub" style="font-size:11px;margin:0">on demand only</div>':''}</td></tr>`).join('')
    + '</tbody>';
  const pages=set.plans.reduce((n,p)=>n+p.pages,0);
  document.getElementById('planFoot').innerHTML =
    `<b>${pages} pages</b> across ${set.plans.length} documents. Reading them whole would cost roughly `
    + `<b>${(pages*RayDocuments.TOKENS_PER_PAGE).toLocaleString()} tokens</b>; this plan budgets <b>${set.estTotal.toLocaleString()}</b>.`;
};
</script>
<script src="../app.js"></script>
</body>
</html>
